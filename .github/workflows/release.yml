name: Release

# Builds the Linux (.deb + .rpm), Windows (.exe) and macOS (.dmg) installers for
# a newly pushed tag and publishes them as downloadable assets on a GitHub Release.
#
# The build jobs run in parallel and the release job waits for all of them, so a
# release is only created once every installer has built successfully.
#
#   check          -> the tag is the version of version.txt, and RELEASE_NOTES.md has its notes
#   test           -> the tests
#   build-deb      -> .deb on an Ubuntu runner
#   build-rpm      -> .rpm in a Rocky Linux 9 container job (EL rpmbuild, .el9), test-installed there
#   build-windows  -> .exe (NSIS) on a real Windows runner
#   build-macos    -> .dmg (Apple Silicon) on a macOS runner
#   release        -> gh release create (becomes the latest release) with the notes of the version
#                     (RELEASE_NOTES.md, via scripts/Release-Notes.sh), the downloads and all assets
#
# The .deb builds on ubuntu-latest (scripts/Build-Deb-Installer.sh, dpkg-deb).
# The .rpm builds on Rocky Linux 9 (scripts/Build-Rpm-Installer.sh, rpmbuild):
# a GitHub Actions container job, no Podman. The Windows installer builds
# natively on windows-latest: .NET publishes win-x64 and NSIS (installed via
# Chocolatey) compiles the .nsi into a real Windows setup.exe. The macOS
# installer builds natively on macos-latest (scripts/Build-Dmg-Installer.sh).
#
# The release version is taken from the tag (a leading "v" is stripped if
# present) and forwarded to the build scripts so artifact filenames match.

on:
  push:
    tags:
      - '**'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Version and release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The scripts name the installers after the version, so the tag must be the version of version.txt
      - name: Check the version
        run: |
          set -eu
          version="$(tr -d '[:space:]' < version.txt)"
          if [ "${version}" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::The tag (${GITHUB_REF_NAME}) is not the version of version.txt (${version})."
            exit 1
          fi

      # No release without notes: the tag needs a section in RELEASE_NOTES.md
      - name: Extract the notes of the version
        run: |
          ./scripts/Release-Notes.sh "${GITHUB_REF_NAME}" > release-notes.md
          cat release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  test:
    name: Test
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test PdfBooklet.slnx --configuration Release --verbosity normal

  build-deb:
    needs: test
    name: Build .deb (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from tag
        id: version
        run: |
          # The tag is the release version, e.g. "1.11.4.0" (or "v1.11.4.0").
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${version}"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build .deb installer
        run: |
          ./scripts/Build-Deb-Installer.sh --version "${{ steps.version.outputs.version }}"

      - name: Verify built artifact
        run: |
          ls -lh installer/deb/pdfbooklet_${{ steps.version.outputs.version }}_*.deb

      - name: Upload .deb installer
        uses: actions/upload-artifact@v4
        with:
          name: deb-installer
          path: installer/deb/*.deb
          if-no-files-found: error

  build-rpm:
    needs: test
    name: Build .rpm (Rocky Linux 9)
    runs-on: ubuntu-latest
    # The job runs inside Rocky Linux 9 (the runner starts the container), so rpmbuild is the EL one and the
    # package gets the .el9 tag. Built on 9, the package also installs on 10 and on Fedora.
    container: quay.io/rockylinux/rockylinux:9
    steps:
      # rpmbuild; git for checkout; libicu for the .NET SDK
      - name: Install the build tools
        run: |
          dnf install -y --nodocs --setopt=install_weak_deps=False \
            rpm-build git tar gzip findutils ca-certificates libicu
          dnf clean all
          rpmbuild --version

      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${version}"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build .rpm installer
        run: |
          ./scripts/Build-Rpm-Installer.sh --version "${{ steps.version.outputs.version }}"

      - name: Verify built artifact
        run: |
          rpm="installer/rpm/x86_64/pdfbooklet-${{ steps.version.outputs.version }}-1.el9.x86_64.rpm"
          ls -lh "$rpm"
          rpm -qpR "$rpm"
          # Installing the package proves its dependencies resolve on a RHEL-family system
          dnf install -y "./$rpm"
          test -x /usr/bin/pdfbooklet
          test -x /usr/lib/pdfbooklet/PdfBooklet

      - name: Upload .rpm installer
        uses: actions/upload-artifact@v4
        with:
          name: rpm-installer
          path: installer/rpm/x86_64/*.rpm
          if-no-files-found: error

  build-windows:
    needs: test
    name: Build Windows .exe (NSIS)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from tag
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${version}"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          # Put makensis on PATH for subsequent steps.
          "C:\Program Files (x86)\NSIS" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & "C:\Program Files (x86)\NSIS\makensis.exe" -version

      - name: Build Windows installer
        # The script publishes win-x64 (self-contained) and runs makensis.
        # Its -DAPP_VERSION flag works with native Windows makensis.
        shell: pwsh
        run: |
          ./scripts/Build-Installer.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Verify built artifact
        shell: bash
        run: |
          ls -lh installer/nsis/PdfBooklet-${{ steps.version.outputs.version }}-win-x64-setup.exe

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer/nsis/PdfBooklet-*-win-x64-setup.exe
          if-no-files-found: error

  build-macos:
    needs: test
    name: Build macOS .dmg
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${version}"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build macOS installer
        run: |
          ./scripts/Build-Dmg-Installer.sh --runtime osx-arm64 --version "${{ steps.version.outputs.version }}"

      - name: Verify built artifact
        run: |
          ls -lh installer/dmg/PdfBooklet-${{ steps.version.outputs.version }}-osx-arm64.dmg

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: installer/dmg/PdfBooklet-*-osx-arm64.dmg
          if-no-files-found: error

  release:
    name: Create release with all installers
    needs: [build-deb, build-rpm, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect installer files
        id: files
        run: |
          set -eu
          mapfile -t files < <(find artifacts -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*-setup.exe' -o -name '*.dmg' \) | sort)
          if [ "${#files[@]}" -lt 4 ]; then
            echo "Expected at least 4 installers (deb, rpm, exe, dmg); found ${#files[@]}:"
            printf '  %s\n' "${files[@]}" >&2
            exit 1
          fi
          printf 'Installers to publish:\n'
          printf '  %s\n' "${files[@]}"
          # Pass the list as a JSON array for the next step.
          {
            echo 'files<<EOF'
            for f in "${files[@]}"; do echo "$f"; done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # The notes of the version, then the downloads (with how to install them)
      - name: Compose the release notes
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          # The tag before this one, in version order
          previous="$(git tag --list --sort=v:refname | awk -v tag="${GITHUB_REF_NAME}" '$0 == tag { print prev; exit } { prev = $0 }')"
          {
            cat artifacts/release-notes/release-notes.md
            echo
            echo "### Downloads"
            echo
            echo "- **Windows** (x64): \`PdfBooklet-${version}-win-x64-setup.exe\`, the installer. It is not signed: if SmartScreen warns, choose More info → Run anyway."
            echo "- **Debian, Ubuntu** (x64): \`sudo apt install ./pdfbooklet_${version}_amd64.deb\`"
            echo "- **Fedora, RHEL, Rocky** (x64): \`sudo dnf install ./pdfbooklet-${version}-1.el9.x86_64.rpm\`"
            echo "- **macOS** (Apple Silicon): \`PdfBooklet-${version}-osx-arm64.dmg\`, drag the app to Applications. It is only ad-hoc signed: open it the first time with right-click → Open."
            echo
            echo "No .NET is needed: every installer is self-contained."
            if [ -n "${previous}" ]; then
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${GITHUB_REF_NAME}"
            fi
          } > release-notes-full.md
          cat release-notes-full.md

      # A release of an existing tag gets the new notes and installers
      - name: Create release and upload installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          mapfile -t files < <(printf '%s\n' '${{ steps.files.outputs.files }}')
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; refreshing notes and assets."
            gh release edit "${GITHUB_REF_NAME}" --notes-file release-notes-full.md
            gh release upload "${GITHUB_REF_NAME}" --clobber "${files[@]}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release-notes-full.md \
              --latest \
              "${files[@]}"
          fi
